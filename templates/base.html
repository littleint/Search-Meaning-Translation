<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FAF7F2]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LinguaVault — A Curated Lexicon{% endblock %}</title>
    <!-- Google Fonts: Playfair Display (Serif) & Plus Jakarta Sans (Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Playfair+Display:ital,wght@0,500..800;1,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'Georgia', 'serif'],
                        body: ['"Newsreader"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        paper: {
                            50: '#FDFBF7',
                            100: '#FAF7F2',
                            200: '#F2ECE1',
                            300: '#E7DEC8',
                        },
                        ink: {
                            900: '#1C1917',
                            800: '#292524',
                            700: '#44403C',
                            500: '#78716C',
                            400: '#A8A29E',
                        },
                        cognac: {
                            50: '#FFFBEB',
                            100: '#FEF3C7',
                            500: '#D97706',
                            600: '#B45309',
                            700: '#92400E',
                            800: '#78350F',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        body {
            background-color: #FAF7F2;
            color: #1C1917;
        }
        .font-serif-title {
            font-family: 'Playfair Display', Georgia, serif;
        }
        .font-editorial {
            font-family: 'Newsreader', Georgia, serif;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans text-ink-900 antialiased selection:bg-cognac-100 selection:text-cognac-800">
    <!-- Navbar -->
    <header class="sticky top-0 z-40 bg-[#FAF7F2]/95 backdrop-blur-md border-b border-[#E7E2D8]">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <div class="flex items-center space-x-3">
                    <a href="/" class="flex items-center space-x-3 group">
                        <div class="w-10 h-10 rounded-xl bg-ink-900 flex items-center justify-center text-paper-50 shadow-sm border border-stone-800 group-hover:bg-cognac-700 transition">
                            <i data-lucide="book-open" class="w-5 h-5 text-cognac-100"></i>
                        </div>
                        <div>
                            <span class="text-xl font-bold font-serif-title tracking-tight text-ink-900 group-hover:text-cognac-700 transition">LinguaVault</span>
                            <span class="text-[11px] block font-medium uppercase tracking-widest text-ink-500 -mt-0.5">The Editorial Lexicon</span>
                        </div>
                    </a>
                </div>

                <!-- Navigation Tabs -->
                {% if user %}
                <nav class="hidden md:flex items-center space-x-1">
                    <a href="/" class="px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-2 {% if active_tab == 'search' %}bg-white text-ink-900 shadow-sm border border-[#E7E2D8]{% else %}text-ink-500 hover:text-ink-900 hover:bg-stone-200/50{% endif %}">
                        <i data-lucide="search" class="w-4 h-4 text-cognac-600"></i>
                        <span>Search & Translate</span>
                    </a>
                    <a href="/vocab" class="px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-2 {% if active_tab == 'vocab' %}bg-white text-ink-900 shadow-sm border border-[#E7E2D8]{% else %}text-ink-500 hover:text-ink-900 hover:bg-stone-200/50{% endif %}">
                        <i data-lucide="bookmark" class="w-4 h-4 text-cognac-600"></i>
                        <span>My Vocab</span>
                        <span id="nav-vocab-badge" class="px-2 py-0.5 text-xs rounded-full bg-stone-200 text-ink-700 font-bold ml-1">...</span>
                    </a>
                </nav>

                <!-- User profile & Logout -->
                <div class="flex items-center space-x-3">
                    <div class="hidden sm:flex items-center space-x-2 text-xs font-medium text-ink-500 bg-white border border-[#E7E2D8] px-3.5 py-1.5 rounded-xl shadow-xs">
                        <div class="w-2 h-2 rounded-full bg-emerald-600"></div>
                        <span class="text-ink-800 max-w-[150px] truncate font-semibold">{{ user.email }}</span>
                    </div>
                    <button onclick="handleLogout()" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-ink-500 hover:text-rose-700 hover:bg-rose-50 transition flex items-center space-x-1.5 border border-transparent hover:border-rose-200">
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Sign Out</span>
                    </button>
                </div>
                {% else %}
                <div class="flex items-center space-x-3">
                    <a href="/login" class="px-4 py-2 rounded-xl text-sm font-semibold text-ink-700 hover:text-ink-900 transition">Sign In</a>
                    <a href="/login?tab=register" class="px-4 py-2 rounded-xl text-sm font-semibold bg-ink-900 text-white hover:bg-ink-800 transition shadow-sm">Create Account</a>
                </div>
                {% endif %}
            </div>
        </div>

        <!-- Mobile Navigation -->
        {% if user %}
        <div class="md:hidden border-t border-[#E7E2D8] bg-[#FAF7F2] px-4 py-2.5 flex justify-around">
            <a href="/" class="flex flex-col items-center py-1 text-xs font-semibold {% if active_tab == 'search' %}text-cognac-700{% else %}text-ink-500{% endif %}">
                <i data-lucide="search" class="w-4 h-4 mb-0.5"></i>
                <span>Search</span>
            </a>
            <a href="/vocab" class="flex flex-col items-center py-1 text-xs font-semibold {% if active_tab == 'vocab' %}text-cognac-700{% else %}text-ink-500{% endif %}">
                <i data-lucide="bookmark" class="w-4 h-4 mb-0.5"></i>
                <span>My Vocab</span>
            </a>
        </div>
        {% endif %}
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Scripts -->
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
